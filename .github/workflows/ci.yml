name: CI

on:
  workflow_call:
    inputs:
      requirements-artifact-id:
        description: Immutable artifact ID of a fresh dependency bundle from this run.
        required: true
        type: string

  pull_request:
  push:
    branches:
      - develop
      - "release/**"
      - "lsp/**"

permissions:
  contents: read

jobs:
  base:
    name: base-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download release dependency bundle
        if: inputs.requirements-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.requirements-artifact-id }}
          path: ${{ runner.temp }}/einf-ci-requirements
          merge-multiple: true
      - name: Prepare dependencies
        run: >-
          python tests/ci/dependencies.py prepare base
          ${{ inputs.requirements-artifact-id && format('--bundle "{0}/einf-ci-requirements"', runner.temp) || '' }}
      - name: Install base test environment
        run: |
          python -m venv .venv-base
          .venv-base/bin/python -m pip install --upgrade pip
          .venv-base/bin/python -m pip install --ignore-installed -e . pytest
      - name: Test without optional dependencies
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export PATH="$PWD/.venv-base/bin:/usr/bin:/bin"
          python - <<'PY'
          import shutil
          from importlib.util import find_spec

          from einf.analysis.checkers import SUPPORTED_CHECKER_NAMES

          for module in (
              "numpy", "torch", "array_api_strict", "libcst",
              "pygls", "lsprotocol", "einops", "einx",
          ):
              assert find_spec(module) is None, module

          for checker in SUPPORTED_CHECKER_NAMES:
              assert shutil.which(checker) is None, checker
          PY
          python -m pytest --junitxml=base-contracts.xml \
            tests/axis/test_dim_solver.py::test_solver_resolves_unique_scalar_solution_with_explicit_size \
            tests/backend/test_backend_dispatch.py::test_backend_dispatch_rejects_distinct_custom_namespaces_with_same_id \
            tests/operations/test_tensorop_backend_identity.py::test_reduce_compile_cache_distinguishes_namespaces_with_same_declared_id \
            tests/plans/test_einsum_symbolic_program_variants.py::test_chain_einsum_program_rejects_incomplete_state \
            tests/plans/test_plan_cache_concurrency.py::test_runner_cache_publishes_last_hit_atomically \
            tests/benchmarks/test_benchmark_artifacts.py::test_publish_receipt_replaces_existing_artifact
          python - <<'PY'
          from xml.etree import ElementTree

          suites = ElementTree.parse("base-contracts.xml").getroot().findall("testsuite")
          assert suites and sum(int(suite.attrib["tests"]) for suite in suites) > 0
          assert all(int(suite.attrib["skipped"]) == 0 for suite in suites)
          PY
          python -m pytest

  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download release dependency bundle
        if: inputs.requirements-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.requirements-artifact-id }}
          path: ${{ runner.temp }}/einf-ci-requirements
          merge-multiple: true
      - name: Prepare dependencies
        run: >-
          python tests/ci/dependencies.py prepare core
          ${{ inputs.requirements-artifact-id && format('--bundle "{0}/einf-ci-requirements"', runner.temp) || '' }}
      - name: Check VCS checkout completeness
        run: python tests/package/verify_vcs_history.py
      - name: Install
        run: |
          python -m pip install --ignore-installed -e ".[dev,analysis,docs]"
          python -c "import array_api_strict; import libcst; import numpy"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Typecheck project
        run: pyrefly check --python-interpreter-path "$(which python)"
      - name: Test
        run: pytest
      - name: Docs
        run: mkdocs build --strict
      - name: Build
        run: python -m build
      - name: Check wheel VCS version
        run: python tests/package/verify_wheel_version.py dist src/einf/_version.py
      - name: Check wheel and sdist installed entry points
        run: python tests/package/verify_wheel_entrypoints.py dist
      - name: Check base install runtime
        run: python tests/package/verify_wheel_base_install.py dist
      - name: Typecheck shipped wheel
        run: python tests/package/verify_wheel_typing.py dist

  checkers:
    name: checker-executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download release dependency bundle
        if: inputs.requirements-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.requirements-artifact-id }}
          path: ${{ runner.temp }}/einf-ci-requirements
          merge-multiple: true
      - name: Prepare dependencies
        run: >-
          python tests/ci/dependencies.py prepare checkers
          ${{ inputs.requirements-artifact-id && format('--bundle "{0}/einf-ci-requirements"', runner.temp) || '' }}
      - name: Install checker integration environment
        run: python -m pip install --ignore-installed -e ".[dev]" pyright zuban
      - name: Verify checker executables
        run: |
          python - <<'PY'
          import shutil
          import subprocess

          from einf.analysis.checkers import SUPPORTED_CHECKER_NAMES

          for checker in SUPPORTED_CHECKER_NAMES:
              executable = shutil.which(checker)
              assert executable is not None, checker
              subprocess.run([executable, "--version"], check=True, timeout=30)
          PY
      - name: Test real checker adapters and validator
        run: |
          python -m pytest tests/integration/test_checker_executables.py \
            --junitxml=checker-contracts.xml
          python - <<'PY'
          from xml.etree import ElementTree

          suites = ElementTree.parse("checker-contracts.xml").getroot().findall("testsuite")
          assert suites and sum(int(suite.attrib["tests"]) for suite in suites) > 0
          assert all(int(suite.attrib["skipped"]) == 0 for suite in suites)
          PY

  windows-checkers:
    name: windows-checkers (Python ${{ matrix.python-version }}, ${{ matrix.environment }})
    runs-on: windows-latest
    env:
      EINF_WINDOWS_TEST_ENV: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        environment: ["system", "venv"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create checker virtual environment
        if: matrix.environment == 'venv'
        run: |
          python -m venv .venv-windows-checkers
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE '.venv-windows-checkers\Scripts')
      - name: Download release dependency bundle
        if: inputs.requirements-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.requirements-artifact-id }}
          path: ${{ runner.temp }}/einf-ci-requirements
          merge-multiple: true
      - name: Prepare dependencies
        run: >-
          python tests/ci/dependencies.py prepare windows
          ${{ inputs.requirements-artifact-id && format('--bundle "{0}/einf-ci-requirements"', runner.temp) || '' }}
      - name: Build and install wheel
        run: |
          python -m pip install --ignore-installed build pytest pyrefly
          python -m build --wheel
          python -m pip install (Get-ChildItem dist/*.whl).FullName
      - name: Typecheck Windows checker boundary
        run: >-
          pyrefly check --python-interpreter-path (Get-Command python).Source
          src/einf/analysis/checkers/windows_job.py
          src/einf/analysis/checkers/execution.py
          tests/analysis/test_windows_checker_job.py
      - name: Exercise installed wheel launcher
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          from einf.analysis.checkers.windows_job import WindowsJob
          import einf.analysis.checkers.windows_job as module

          assert (sys.prefix != sys.base_prefix) == (os.environ["EINF_WINDOWS_TEST_ENV"] == "venv")
          assert Path(module.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          with WindowsJob() as job:
              completed = subprocess.run(
                  job.launch_command((sys.executable, "-I", "-S", "-c", "print('installed')")),
                  capture_output=True, check=True, timeout=15,
              )
              assert completed.stdout.strip() == b"installed"
              assert job.checker_started() and job.is_empty()
      - name: Test Windows process ownership
        run: >-
          python -m pytest
          tests/analysis/test_windows_checker_job.py
          tests/analysis/test_checker_execution.py::test_checker_executor_normalizes_spawn_failure
          --junitxml=windows-checker-contracts.xml
      - name: Reject skipped native checks
        shell: python
        run: |
          from xml.etree import ElementTree

          suites = ElementTree.parse("windows-checker-contracts.xml").getroot().findall("testsuite")
          assert suites and sum(int(suite.attrib["tests"]) for suite in suites) > 0
          assert all(int(suite.attrib["skipped"]) == 0 for suite in suites)

  lsp:
    name: lsp-extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download release dependency bundle
        if: inputs.requirements-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.requirements-artifact-id }}
          path: ${{ runner.temp }}/einf-ci-requirements
          merge-multiple: true
      - name: Prepare dependencies
        run: >-
          python tests/ci/dependencies.py prepare lsp
          ${{ inputs.requirements-artifact-id && format('--bundle "{0}/einf-ci-requirements"', runner.temp) || '' }}
      - name: Install
        run: python -m pip install --ignore-installed -e ".[dev,analysis,lsp]"
      - name: Typecheck optional LSP transport
        run: >-
          pyrefly check
          --python-interpreter-path "$(which python)"
          benchmarks/profile/lsp_latency.py
          src/einf/analysis/lsp/cli.py
          src/einf/analysis/lsp/server.py
          src/einf/analysis/lsp/hover.py
          src/einf/analysis/lsp/inlay_hints.py
          src/einf/analysis/lsp/position_codec.py
          src/einf/analysis/lsp/semantic_tokens.py
          tests/analysis/test_analysis_lsp_position_encoding.py
          tests/analysis/test_analysis_lsp_server.py
          tests/analysis/test_analysis_lsp_resource_limits.py
          tests/analysis/test_conformance_analysis_lsp.py
          tests/analysis/test_pyright_lsp_positions.py
          tests/benchmarks/test_benchmark_lsp_latency.py
      - name: Test optional LSP transport
        run: >-
          pytest
          tests/analysis/test_analysis_lsp.py
          tests/analysis/test_analysis_lsp_debounce.py
          tests/analysis/test_analysis_lsp_position_encoding.py
          tests/analysis/test_analysis_lsp_server.py
          tests/analysis/test_analysis_lsp_resource_limits.py
          tests/analysis/test_conformance_analysis.py
          tests/analysis/test_conformance_analysis_lsp.py
          tests/analysis/test_pyright_lsp_positions.py
          tests/benchmarks/test_benchmark_lsp_latency.py

  torch:
    name: torch-extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download release dependency bundle
        if: inputs.requirements-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.requirements-artifact-id }}
          path: ${{ runner.temp }}/einf-ci-requirements
          merge-multiple: true
      - name: Prepare dependencies
        run: >-
          python tests/ci/dependencies.py prepare torch
          ${{ inputs.requirements-artifact-id && format('--bundle "{0}/einf-ci-requirements"', runner.temp) || '' }}
      - name: Install
        run: python -m pip install --ignore-installed -e ".[dev,analysis,lsp]" torch

      - name: Typecheck repository with optional dependencies
        run: >-
          pyrefly check
          --python-interpreter-path "$(which python)"
          src tests benchmarks
      - name: Test optional PyTorch integration
        run: >-
          pytest
          tests/integration/test_array_api_contract_einop_execution.py
          tests/integration/test_array_api_rearrange_execution.py
          tests/integration/test_array_api_repeat_reduce_execution.py
          tests/integration/test_array_api_view_execution.py
          tests/steps/test_backend_exception_projection.py
      - name: Test PyTorch benchmark input integrity
        run: >-
          pytest
          tests/benchmarks/test_benchmark_input_identity.py::test_torch_repeat_input_identity
          tests/benchmarks/test_benchmark_harness.py::test_torch_profiler_detects_in_place_input_mutation
          tests/benchmarks/test_benchmark_harness.py::test_torch_profiler_detects_mutation_without_real_torch
          tests/benchmarks/test_benchmark_expression_host_inputs.py
          tests/benchmarks/test_benchmark_failure_retention.py
