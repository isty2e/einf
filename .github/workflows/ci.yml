name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - "release/**"
      - "lsp/**"

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,analysis,docs]"
      - name: Lint
        run: ruff check --extend-select I,UP src tests benchmarks
      - name: Typecheck source surfaces
        run: >-
          basedpyright
          --pythonpath "$(which python)"
          src/einf/operations/api.pyi
          src/einf/analysis/checkers
          src/einf/analysis/lsp/checker_coordinator.py
          src/einf/analysis/lsp/config.py
          src/einf/analysis/lsp/service.py
          src/einf/analysis/lsp/change_debounce.py
          src/einf/analysis/validator/cli.py
          src/einf/analysis/validator/run.py
          benchmarks/profile/lsp_latency.py
          tests/analysis/test_analysis_checkers.py
          tests/analysis/test_analysis_lsp_checker_coordinator.py
          tests/analysis/test_analysis_lsp.py
          tests/analysis/test_analysis_lsp_debounce.py
          tests/analysis/test_conformance_analysis.py
          tests/analysis/test_analysis_validator.py
          tests/analysis/test_checker_execution.py
          tests/benchmarks/test_benchmark_lsp_latency.py
      - name: Test
        run: pytest
      - name: Docs
        run: mkdocs build --strict
      - name: Build
        run: python -m build
      - name: Typecheck shipped wheel
        run: python tests/package/verify_wheel_typing.py dist

  lsp:
    name: lsp-extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,analysis,lsp]"
      - name: Typecheck optional LSP transport
        run: >-
          basedpyright
          --pythonpath "$(which python)"
          src/einf/analysis/lsp/cli.py
          src/einf/analysis/lsp/server.py
          src/einf/analysis/lsp/hover.py
          src/einf/analysis/lsp/inlay_hints.py
          tests/analysis/test_analysis_lsp_server.py
          tests/analysis/test_conformance_analysis_lsp.py
      - name: Test optional LSP transport
        run: >-
          pytest
          tests/analysis/test_analysis_lsp.py
          tests/analysis/test_analysis_lsp_debounce.py
          tests/analysis/test_analysis_lsp_server.py
          tests/analysis/test_conformance_analysis.py
          tests/analysis/test_conformance_analysis_lsp.py
