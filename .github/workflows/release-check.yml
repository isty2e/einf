name: Release dependency check
run-name: Latest-compatible dependencies @ ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths: [.github/workflows/release-check.yml]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve latest-compatible dependencies
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'ci/verify-latest-compatible-release' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      requirements-artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install resolver
        run: python -m pip install uv
      - name: Resolve dependency bundle
        env:
          UV_NO_CACHE: "1"
        run: python tests/ci/dependencies.py resolve "${{ runner.temp }}/einf-ci-requirements"
      - name: Retain resolution evidence
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-compatible-dependencies-${{ github.run_attempt }}
          path: ${{ runner.temp }}/einf-ci-requirements
          if-no-files-found: error
      - name: Require published bundle identity
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
        run: test -n "$ARTIFACT_ID"

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      requirements-artifact-id: ${{ needs.resolve.outputs.requirements-artifact-id }}
