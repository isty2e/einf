[build-system]
requires = ["hatch-vcs>=0.4", "hatchling>=1.24"]
build-backend = "hatchling.build"


[project]
name = "einf"
dynamic = ["version"]
description = "Tensor DSL with axis signatures and first-class TensorOp transforms."
requires-python = ">=3.10"
dependencies = [
  "array-api-compat>=1.13",
  "opt_einsum>=3.4",
  "typing_extensions>=4.8; python_version < '3.11'",
]


[project.optional-dependencies]
dev = [
  "basedpyright>=1.31",
  "build>=1.2",
  "einx",
  "einops",
  "numpy>=1.26",
  "pytest>=8.0",
  "ruff==0.16.0",
]
analysis = [
  "libcst>=1.0",
]
lsp = [
  "lsprotocol>=2023.0.0",
  "pygls>=1.3",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]

[project.scripts]
einf-validate = "einf.analysis.validator.cli:main"
einf-lsp = "einf.analysis.lsp.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/einf"]

[tool.hatch.build.targets.wheel.force-include]
"src/einf/operations/api.pyi" = "einf/operations/api.pyi"
"src/einf/py.typed" = "einf/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "src/einf/**/*.py",
  "src/einf/**/*.pyi",
  "src/einf/py.typed",
  "tests/**/*.py",
  "pyproject.toml",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/einf/_version.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.basedpyright]
include = ["src", "tests"]
exclude = [
  "src/einf/analysis/lsp/cli.py",
  "src/einf/analysis/lsp/hover.py",
  "src/einf/analysis/lsp/inlay_hints.py",
  "src/einf/analysis/lsp/server.py",
  "tests/analysis/test_analysis_lsp_server.py",
  "tests/analysis/test_conformance_analysis_lsp.py",
]
typeCheckingMode = "standard"
